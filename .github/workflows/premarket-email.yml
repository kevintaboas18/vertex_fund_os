name: Pre-market movers

# Este workflow ya NO manda el correo: lo dispara.
#
# Lo mandaba desde el runner, y eso obligaba a tener FMP_API_KEY,
# RESEND_API_KEY y VERTEX_DB_KEY duplicadas en los secrets del repositorio
# aunque ya estuvieran puestas en Render. GitHub Actions no ve las variables de
# Render —son dos entornos distintos— así que llegaban vacías y el envío moría
# antes de empezar, con el workflow en rojo y las claves «puestas».
#
# Ahora el envío vive en la app, donde ya viven las claves, y GitHub hace lo
# único que sabe hacer bien aquí: sonar a una hora. De paso, la petición
# despierta al servicio dormido del plan free.
#
# Cron en UTC: 11:00 UTC = 7:00 ET en verano (EDT, UTC-4) y 6:00 ET en invierno
# (EST, UTC-5). GitHub no admite husos horarios y ADEMÁS no es puntual: con
# `30 11` se le ha visto disparar a las 12:08 y a las 13:52 UTC. Por eso la app
# acepta una ventana (6-10 ET) en vez de una hora exacta.
on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      seco:
        description: "Armar el correo y decir a quién iría, SIN mandarlo"
        type: boolean
        default: true
      forzar:
        description: "Saltarse la ventana horaria (para probar a deshora)"
        type: boolean
        default: true

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Sin checkout ni Python: no se ejecuta nada del repositorio.
      #
      # Dos secrets, y ninguno es una clave de proveedor:
      #   VERTEX_URL    la URL pública de Render (https://...onrender.com)
      #   VERTEX_API_TOKEN  el mismo que ya está en el dashboard de Render
      - name: Disparar el envío pre-market
        env:
          VERTEX_URL: ${{ secrets.VERTEX_URL }}
          VERTEX_API_TOKEN: ${{ secrets.VERTEX_API_TOKEN }}
          SECO: ${{ inputs.seco && 'true' || 'false' }}
          FORZAR: ${{ inputs.forzar && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${VERTEX_URL:-}" ] || [ -z "${VERTEX_API_TOKEN:-}" ]; then
            echo "::error::Faltan VERTEX_URL o VERTEX_API_TOKEN en Settings > Secrets."
            exit 1
          fi
          # `--max-time 180`: el plan free duerme y arrancar en frío puede
          # tardar más de un minuto. Un timeout corto reportaría "caído" un
          # servicio que solo estaba despertando.
          codigo=$(curl -sS -o respuesta.json -w '%{http_code}' --max-time 180 \
            -X POST "${VERTEX_URL%/}/api/premarket/enviar?seco=${SECO}&forzar=${FORZAR}" \
            -H "x-vertex-token: ${VERTEX_API_TOKEN}")
          echo "HTTP ${codigo}"
          cat respuesta.json; echo
          # El cuerpo ya se imprimió: si la app dice que no salió ni un correo,
          # contesta 502 y esto sale en rojo. Salir en verde sin haber mandado
          # nada es el fallo que costó meses de silencio.
          [ "${codigo}" = "200" ]
