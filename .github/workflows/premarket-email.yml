name: Pre-market movers

# M-03: scripts/premarket_email.py decía "corre en GitHub Actions cada mañana
# de mercado", pero no existía ningún workflow — era código muerto.
#
# Cron en UTC: 11:00 UTC = 7:00 ET en verano (EDT, UTC-4) y 6:00 ET en invierno
# (EST, UTC-5). GitHub no admite husos horarios y ADEMÁS no es puntual: con
# `30 11` se le ha visto disparar a las 12:08 y a las 13:52 UTC. Por eso el
# script acepta una ventana (6-10 ET) en vez de una hora exacta — antes exigía
# las 8 en punto, no se cumplía nunca, y como saltarse el envío devuelve 0 el
# workflow salía en verde sin haber mandado un solo correo.
on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Imprimir el email en vez de enviarlo"
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `cryptography` para descifrar `Privado/privado.enc` y sacar el email
      # de cada cuenta. Sin ella el guion no falla: cae a EMAIL_TO.
      - run: pip install --quiet cryptography

      - name: Enviar resumen pre-market
        env:
          # Configura RESEND_API_KEY en Settings > Secrets and variables > Actions.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Los movers salen de FMP: stockanalysis.com devolvía 403 al runner.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # La MISMA clave con la que la app cifra las cuentas. Es lo que
          # permite mandarle a cada usuario a SU correo en vez de a una lista
          # fija. Sin ella se usa EMAIL_TO y se dice en el log.
          VERTEX_DB_KEY: ${{ secrets.VERTEX_DB_KEY }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          # workflow_dispatch: por defecto NO envía, para poder probar sin ruido.
          # El cron deja ambas vacías, así que envía de verdad.
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python scripts/premarket_email.py
