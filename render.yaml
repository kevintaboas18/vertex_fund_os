# Render Blueprint para Vertex Fund OS (Warren Buffett Jr).
# Las claves NO van aquí: se configuran en el dashboard (sync: false pide el valor).
services:
  - type: web
    name: vertex-fund-os
    runtime: python
    # 'free' NO tiene disco persistente: cada redeploy y cada despertar tras
    # dormir borra el sistema de archivos entero.
    #
    # Eso YA NO IMPORTA. Los datos viven en EL ALMACÉN (`vertex_almacen.py`):
    # un clon de la rama `datos` de este mismo repositorio, que se restaura al
    # arrancar y se respalda solo. Reportes de los dos agentes, memoria,
    # perfiles, cuentas (cifradas) y las series del motor sobreviven a que
    # Render borre el disco — y a que borres el servicio entero.
    #
    # Lo único obligatorio para que funcione es VERTEX_GIT_TOKEN, abajo. Sin
    # él la app corre igual pero NO respalda, y lo dice en `/api/almacen` y en
    # la barra superior.
    #
    # El disco de pago sigue disponible (bloque `disk` de abajo) y no estorba:
    # si lo activas, el almacén vive ahí y se respalda igual, pero deja de ser
    # imprescindible.
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn vertex_api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    # --- Disco persistente (SOLO en planes de pago: starter+) ---
    # Descomenta ESTO y la variable VERTEX_DB de abajo, a la vez: el disco sin
    # la variable no sirve de nada (la DB seguiría escribiéndose fuera de él).
    # disk:
    #   name: vertex-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # La SEC exige identificarse con un contacto real
      # (sec.gov/os/webmaster-faq#developers). Va como `sync: false` para
      # pedirlo en el dashboard: este archivo esta en un repo publico y un
      # correo personal ahi es una direccion mas para cosechar.
      # Formato: "NombreDelProyecto tu-correo@ejemplo.com"
      - key: EDGAR_USER_AGENT
        sync: false
      # Con el disco activo, descomenta esto para que la memoria sobreviva a
      # los redeploys. Sin el bloque `disk` de arriba, no hace nada.
      # - key: VERTEX_DB
      #   value: /var/data/vertex.db
      # C-02: clave de acceso a la API. SIN esta variable el servicio solo
      # atiende a localhost, asi que en Render quedaria inutilizable: es
      # obligatoria. Genera una larga y aleatoria (ej. `openssl rand -hex 24`).
      - key: VERTEX_API_TOKEN
        sync: false
      # C-04: origen permitido por CORS. Pon aqui la URL publica de Render
      # (https://...onrender.com). Sin ella, CORS solo admite localhost.
      - key: VERTEX_ORIGIN
        sync: false
      # C-03: cifra el access_token de Plaid guardado en la DB.
      #
      # Ahora es MÁS que recomendada: es la clave con la que el almacén cifra
      # las cuentas, las contraseñas y los perfiles antes de subirlos. SIN ELLA
      # esos datos NO se respaldan — un hash de contraseña sin cifrar no se
      # sube a un repositorio, ni siquiera privado, así que se prefiere
      # perderlos a filtrarlos. Genera una larga: `openssl rand -hex 32`.
      #
      # Guárdala aparte. Si la pierdes, el respaldo de las cuentas es
      # irrecuperable: eso es lo que significa que esté bien cifrado.
      - key: VERTEX_DB_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Claude (Anthropic): capa de judge para lo cualitativo (moat, catalizadores, etc.)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Modelo del judge. `wbj.config` lo lee y `vertex_api` lo respeta; sin
      # declararlo aqui habia que ponerlo a mano en el dashboard cada vez.
      - key: JUDGE_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      # Quant Data: enriquece Proyecciones (flujo de opciones, dark pool). Su
      # plan API esta inactivo, asi que hoy devuelve 403 y toda la capa cae a
      # lo que se deriva de la cadena. Dejala vacia hasta que lo actives.
      - key: QUANTDATA_API_KEY
        sync: false
      # ── Motor de Víctor (Tito) — área de Proyecciones ──────────────────
      # MARKETSNACK_COOKIE sostiene 4 de los 6 sub-agentes (Agresividad,
      # Convicción, Inusualidad y Contexto IV). OJO: NO es una API key, es una
      # COOKIE DE SESIÓN y CADUCA. En un servidor no hay navegador que la
      # refresque, así que hay que re-pegarla a mano cada vez que muera. Sin
      # ella el motor sigue corriendo con la cadena (Estructura + GEX +
      # niveles) y lo declara en `warnings`, pero el scorecard va incompleto.
      - key: MARKETSNACK_COOKIE
        sync: false
      # OBLIGATORIA para Proyecciones. La cadena de opciones y las barras
      # entran SOLO por Massive, la fuente de Víctor — sin respaldo a yfinance
      # a propósito: un fallback silencioso cambiaría los datos bajo los pies
      # del scorecard y dos corridas dejarían de ser comparables. Sin esta key
      # /api/projection-targets devuelve error, no un reporte a medias.
      - key: MASSIVE_API_KEY
        sync: false
      # Tope de paginación de la cadena (40 ≈ 10k contratos). Salvaguarda de
      # cuota: sin él, un subyacente con miles de strikes la agota en una sola
      # consulta.
      - key: MASSIVE_MAX_PAGES
        value: "40"
      # ── EL ALMACÉN: por qué ya no se pierde nada ────────────────────────
      #
      # OBLIGATORIA para que los datos sobrevivan. Es un token de GitHub con
      # permiso de ESCRITURA de contenido sobre este repositorio (fine-grained:
      # Contents → Read and write). Con él, el servidor commitea y empuja a la
      # rama `datos`.
      #
      # La rama es HUÉRFANA: no comparte historia con `main`, así que los
      # cientos de commits de datos no ensucian el historial del código y NO
      # disparan un despliegue nuevo cada vez que analizas un ticker.
      #
      # Sin esta variable la app funciona igual, pero NO respalda: lo que
      # analices hoy desaparece en el próximo redeploy. Se avisa en la barra
      # superior y en /api/almacen — nunca en silencio.
      - key: VERTEX_GIT_TOKEN
        sync: false
      # Opcional. Sin ella, el almacén deduce el repositorio del `origin` del
      # propio código: los datos van al MISMO repo, en la rama `datos`.
      # Ponla solo si quieres los datos en OTRO repositorio.
      # - key: VERTEX_ALMACEN_REMOTO
      #   value: https://github.com/kevintaboas18/vertex_fund_os.git
      #
      # Dónde vive el clon dentro del contenedor. Con `disk` activo, apúntalo
      # ahí (/var/data/almacen) y el arranque será instantáneo en vez de clonar.
      # - key: VERTEX_ALMACEN
      #   value: /var/data/almacen
      #
      # Las series diarias del motor de Víctor caen DENTRO del almacén, así que
      # esta variable ya no hace falta. Definirla la saca de ahí y vuelve a
      # perderlas en cada reinicio — con ellas se apagan el sub-agente 6, el IV
      # Rank real y la auto-calibración. Se deja comentada a propósito.
      # - key: WBJ_TITO_DATA
      #   value: /var/data/tito
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        sync: false
